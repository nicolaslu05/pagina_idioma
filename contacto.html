<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto | Proyecto Temático</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <header>
        <h1>Proyecto Temático</h1>
    </header>

    <nav>
        <ul>
            <li><a href="index.html">Inicio</a></li>
            <li><a href="tabla.html">Tabla</a></li>
            <li><a href="contacto.html">Contacto</a></li>
        </ul>
    </nav>

    <div class="form-container">
        <h2>Formulario de Participación</h2>
        <p>Déjanos tus datos para participar en las actividades del Día del Idioma.</p>
    
        <form action="#" method="post">
            <label for="nombre">Nombre completo:</label>
            <input type="text" id="nombre" name="nombre" required placeholder="Tu nombre aquí">
    
            <label for="correo">Correo electrónico:</label>
            <input type="email" id="correo" name="correo" required placeholder="tucorreo@ejemplo.com">
    
            <label for="edad">Edad:</label>
            <input type="number" id="edad" name="edad" min="10" max="100" required>
    
            <label for="pais">País:</label>
            <select id="pais" name="pais" required>
                <option value="">Selecciona tu país</option>
                <option value="colombia">Colombia</option>
                <option value="mexico">México</option>
                <option value="españa">España</option>
                <option value="otros">Otro</option>
            </select>
    
            <label>¿Qué actividades te interesan?</label>
            <div class="checkbox-group">
                <label><input type="checkbox" name="actividades" value="concurso"> Concurso de ortografía</label>
                <label><input type="checkbox" name="actividades" value="lectura"> Lectura de poemas</label>
                <label><input type="checkbox" name="actividades" value="teatro"> Obra de teatro</label>
            </div>
    
            <label for="mensaje">Mensaje adicional:</label>
            <textarea id="mensaje" name="mensaje" rows="4" placeholder="Escribe aquí tus comentarios..."></textarea>
    
            <div class="botones">
                <button type="submit">Enviar</button>
                <button type="reset">Limpiar</button>
            </div>
        </form>
    </div>

    <footer>
        <p>© 2025 Día del Idioma | Elaborado por [ Nicolas luna mestre ]</p>
    </footer>
</body>
</html>
